name: Build AR2 Crosshair (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'crosshair-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crosshair-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build installer + portable
        run: npx electron-builder --win nsis portable --x64 --publish never -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ar2-crosshair-windows
          path: |
            crosshair-app/dist/*.exe
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/AR2-Crosshair-Setup-*.exe dist/AR2-Crosshair-Portable-*.exe --clobber
