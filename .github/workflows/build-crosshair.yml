name: Build AR2 Crosshair (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crosshair-app/**'
      - '.github/workflows/build-crosshair.yml'
    tags:
      - 'crosshair-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crosshair-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Tests de non-régression des profils
        run: npm test
      - name: Build installeur + portable + zip
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ar2-crosshair-windows
          path: |
            crosshair-app/dist/*.exe
            crosshair-app/dist/*.zip
            crosshair-app/dist/*.blockmap
            crosshair-app/dist/latest.yml

  selftest:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ar2-crosshair-windows
          path: dist
      - name: Installation silencieuse + auto-test
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length
          $inst = Start-Process -FilePath "dist\AR2-Crosshair-Setup.exe" -ArgumentList '/S','/currentuser' -Wait -PassThru
          "Code de sortie installateur: $($inst.ExitCode)"
          $exe = $null
          for ($i = 0; $i -lt 60 -and -not $exe; $i++) {
            foreach ($d in @("$env:LOCALAPPDATA\Programs", $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($d -and (Test-Path $d)) {
                $f = Get-ChildItem $d -Recurse -Depth 3 -Filter 'AR2 Crosshair.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($f) { $exe = $f.FullName; break }
              }
            }
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) {
            Write-Warning "exe installé introuvable, auto-test sur la version zip"
            Expand-Archive "dist\AR2-Crosshair-Windows.zip" -DestinationPath "$env:RUNNER_TEMP\ar2zip" -Force
            $f = Get-ChildItem "$env:RUNNER_TEMP\ar2zip" -Recurse -Filter 'AR2 Crosshair.exe' | Select-Object -First 1
            if (-not $f) { throw "exe introuvable" }
            $exe = $f.FullName
          }
          "Exe: $exe"
          (Get-Item $exe).VersionInfo | Format-List ProductVersion, FileVersion
          $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest=$out" -PassThru
          $p | Wait-Process -Timeout 300 -ErrorAction SilentlyContinue
          if (!$p.HasExited) { $p | Stop-Process -Force }
          Get-Content $out
          $j = Get-Content $out | ConvertFrom-Json
          if (-not $j.overlay.created) { throw "overlay non créé" }
          if (-not $j.hook.started) { throw "détection clavier non démarrée: $($j.hook.error)" }
          if (-not $j.switchOk) { throw "changement d'arme automatique KO" }
          if ($j.update.state -eq "error") { Write-Warning "mise à jour: $($j.update.error)" }
          if (-not $j.wikiOk) { Write-Warning "wiki AR2: $($j.wiki | ConvertTo-Json -Compress)" }
          if (-not $j.hudOk) { Write-Warning "HUD v1.5: $($j.hud | ConvertTo-Json -Compress) $($j.hudError)" }
          "AUTO-TEST OK"

  release:
    needs: selftest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ar2-crosshair-windows
          path: dist
      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="crosshair-v$(node -p "require('./crosshair-app/package.json').version")"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "AR2 Crosshair ${TAG#crosshair-}" --notes-file crosshair-app/RELEASE_NOTES.md --latest
          fi
          gh release upload "$TAG" dist/*.exe dist/*.zip dist/*.blockmap dist/latest.yml --clobber
          gh release edit "$TAG" --latest --draft=false

  update-test:
    needs: release
    uses: ./.github/workflows/test-update.yml
    with:
      from_tag: crosshair-v1.8.1
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
