name: Test mise à jour automatique (Windows)

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Version installée au départ (tag de release)'
        required: true
        default: 'crosshair-v1.1.0'
  workflow_call:
    inputs:
      from_tag:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Installer l'ancienne version puis laisser l'appli se mettre à jour
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          FROM_TAG: ${{ inputs.from_tag }}
        run: |
          gh release download "$env:FROM_TAG" --repo "${{ github.repository }}" --pattern 'AR2-Crosshair-Setup.exe' --dir old
          Start-Process -FilePath "old\AR2-Crosshair-Setup.exe" -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AR2 Crosshair\AR2 Crosshair.exe'
          function Get-AppVersion {
            $k = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'AR2 Crosshair*' } | Select-Object -First 1
            if ($k) { return [string]$k.DisplayVersion } else { return $null }
          }
          $before = Get-AppVersion
          "Version installée au départ (registre) : $before"
          $latest = (gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          "Dernière release : $latest"
          $want = $latest -replace '^.*v',''
          $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest=$out","--selftest-update" -PassThru
          $p | Wait-Process -Timeout 400 -ErrorAction SilentlyContinue
          Get-Content $out
          # l'installeur silencieux tourne après la fermeture de l'appli
          $deadline = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 5
            $after = Get-AppVersion
          } while ($after -ne $want -and (Get-Date) -lt $deadline)
          "Version après mise à jour (registre) : $after"
          Start-Sleep -Seconds 5
          Get-Process -Name 'AR2 Crosshair' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          # relance de l'appli mise à jour : elle doit annoncer la nouvelle version
          $out2 = Join-Path $env:RUNNER_TEMP 'selftest2.json'
          $p2 = Start-Process -FilePath $exe -ArgumentList "--selftest=$out2" -PassThru
          $p2 | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
          $j = Get-Content $out2 -Raw | ConvertFrom-Json
          "Version annoncée par l'appli relancée : $($j.version) (switchOk=$($j.switchOk))"
          if ($after -ne $want -or $j.version -ne $want) { throw "Mise à jour KO : $before -> $after / appli $($j.version) (attendu $want)" }
          "MISE À JOUR AUTOMATIQUE OK : $before -> $($j.version)"
