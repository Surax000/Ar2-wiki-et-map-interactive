<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Inter,system-ui,sans-serif}
#box{margin:0;padding:10px 12px;border-radius:12px;background:rgba(10,13,18,.78);border:1px solid rgba(0,255,136,.35);color:#e6edf3;transform-origin:top left}
.t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#00ff88;display:flex;justify-content:space-between;margin-bottom:6px}
.t span{color:#8b949e;letter-spacing:0}
.i{display:flex;align-items:center;gap:8px;height:26px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{flex:none;width:14px;height:14px;border-radius:4px;border:2px solid #8b949e;box-sizing:border-box}
.d .c{background:#00ff88;border-color:#00ff88}
.d .x{text-decoration:line-through;color:#8b949e}
.x{overflow:hidden;text-overflow:ellipsis}
</style></head><body><div id="box"></div>
<script src="checklist.js"></script>
</body></html>
