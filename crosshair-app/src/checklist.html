<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Inter,system-ui,sans-serif}
#box{margin:0;padding:10px 12px;border-radius:12px;background:var(--c-hud,rgba(10,13,18,.78));border:1px solid rgb(var(--t-acc,0 255 136) / .35);color:var(--c-text,#e6edf3);transform-origin:top left}
.t{-webkit-app-region:drag;cursor:move;user-select:none;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c-acc,#00ff88);display:flex;justify-content:space-between;margin-bottom:6px}
.t span{color:var(--c-muted,#8b949e);letter-spacing:0}
.i{display:flex;align-items:center;gap:8px;width:100%;height:26px;padding:0;border:0;background:transparent;color:inherit;text-align:left;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-app-region:no-drag}.i:disabled{opacity:.7}
.c{flex:none;width:14px;height:14px;border-radius:4px;border:2px solid var(--c-muted,#8b949e);box-sizing:border-box}
.d .c{background:var(--c-acc,#00ff88);border-color:var(--c-acc,#00ff88)}
.d .x{text-decoration:line-through;color:var(--c-muted,#8b949e)}
.x{overflow:hidden;text-overflow:ellipsis}
</style></head><body><div id="box"></div>
<script src="ar2-tools.js"></script>
<script src="theme-client.js"></script>
<script src="checklist.js"></script>
</body></html>
